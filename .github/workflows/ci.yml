name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eventmaster
          POSTGRES_PASSWORD: eventmaster
          POSTGRES_DB: eventmaster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventmaster"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://eventmaster:eventmaster@localhost:5432/eventmaster_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Lint (oxlint)
        run: pnpm run lint
      - run: pnpm run test
      - name: Fitness functions (arquitetura)
        run: pnpm run arch
      - name: Auditoria de dependências (produção)
        run: pnpm audit --prod --audit-level high
      - name: Contrato OpenAPI atualizado
        run: pnpm --filter @eventmaster/api run openapi:generate && git diff --exit-code apps/api/openapi.json
      - name: Cliente tipado atualizado
        run: pnpm --filter @eventmaster/api-client run generate && git diff --exit-code packages/api-client/src/schema.d.ts
      - name: Build do front-end
        run: pnpm --filter @eventmaster/web run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eventmaster
          POSTGRES_PASSWORD: eventmaster
          POSTGRES_DB: eventmaster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventmaster"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Navegador do Playwright
        run: pnpm --filter @eventmaster/e2e exec playwright install --with-deps chromium
      - name: E2E e acessibilidade
        run: pnpm run e2e
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Segredos descartáveis para o teste
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=$|JWT_SECRET=$(openssl rand -hex 32)|; s|^WEBHOOK_SECRET=$|WEBHOOK_SECRET=$(openssl rand -hex 32)|" .env
      - name: Build das imagens
        run: docker compose --profile app build
      - name: Subir a aplicação completa
        run: docker compose --profile app up -d --wait --wait-timeout 180
      - name: Smoke test
        run: infra/smoke-test.sh
      - name: API reiniciada continua acessível pelo front
        run: |
          docker compose --profile app up -d --force-recreate --wait api
          for i in $(seq 1 10); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/events)" = 200 ] && exit 0
            sleep 3
          done
          echo "nginx não alcançou a API recriada" && exit 1
      - name: Logs em caso de falha
        if: failure()
        run: docker compose --profile app logs --no-color | tail -200
      - name: Derrubar
        if: always()
        run: docker compose --profile app down -v
