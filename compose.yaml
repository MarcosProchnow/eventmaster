services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eventmaster
      POSTGRES_PASSWORD: eventmaster # apenas desenvolvimento local
      POSTGRES_DB: eventmaster
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventmaster -d eventmaster"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
